<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefdf6"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17b37f"/>
      <stop offset="100%" stop-color="#0c9268"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#pagebg)"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="230" height="720" fill="#ffffff" opacity="0.65"/>
  <text x="30" y="55" font-size="22" font-weight="bold" fill="#0a4c3b">🐾 PetCare Hub</text>
  <g font-size="15" fill="#334155">
    <rect x="20" y="90" width="190" height="38" rx="10" fill="url(#primaryGrad)"/>
    <text x="35" y="114" fill="#ffffff" font-weight="bold">Dashboard</text>
    <text x="35" y="160">My Pets</text>
    <text x="35" y="196">Vaccinations</text>
    <text x="35" y="232">Medical History</text>
    <text x="35" y="268">Medicines</text>
    <text x="35" y="304">Appointments</text>
    <text x="35" y="340">Expenses</text>
    <text x="35" y="376">Documents</text>
  </g>

  <!-- topbar -->
  <text x="260" y="55" font-size="26" font-weight="bold" fill="#1e293b">Welcome back, Alex 👋</text>
  <text x="260" y="80" font-size="14" fill="#64748b">Here's what's happening with your pets today</text>
  <rect x="1030" y="35" width="130" height="42" rx="12" fill="url(#primaryGrad)"/>
  <text x="1060" y="61" font-size="14" fill="#ffffff" font-weight="bold">+ Add Pet</text>

  <!-- stat cards -->
  <g>
    <rect x="260" y="110" width="215" height="110" rx="18" fill="#ffffff" opacity="0.75"/>
    <text x="280" y="150" font-size="28" font-weight="bold" fill="#0a4c3b">3</text>
    <text x="280" y="172" font-size="13" fill="#64748b">Total Pets</text>

    <rect x="490" y="110" width="215" height="110" rx="18" fill="#ffffff" opacity="0.75"/>
    <text x="510" y="150" font-size="28" font-weight="bold" fill="#b91c1c">3</text>
    <text x="510" y="172" font-size="13" fill="#64748b">Vaccinations Due</text>

    <rect x="720" y="110" width="215" height="110" rx="18" fill="#ffffff" opacity="0.75"/>
    <text x="740" y="150" font-size="28" font-weight="bold" fill="#1557e1">3</text>
    <text x="740" y="172" font-size="13" fill="#64748b">Upcoming Visits</text>

    <rect x="950" y="110" width="210" height="110" rx="18" fill="#ffffff" opacity="0.75"/>
    <text x="970" y="150" font-size="28" font-weight="bold" fill="#c8a86c">2</text>
    <text x="970" y="172" font-size="13" fill="#64748b">Active Medicines</text>
  </g>

  <!-- chart panel -->
  <rect x="260" y="245" width="565" height="250" rx="20" fill="#ffffff" opacity="0.7"/>
  <text x="285" y="278" font-size="14" fill="#64748b">This Month</text>
  <text x="285" y="305" font-size="24" font-weight="bold" fill="#1e293b">$214.50</text>
  <g>
    <rect x="300" y="400" width="40" height="60" rx="6" fill="#17b37f"/>
    <rect x="360" y="380" width="40" height="80" rx="6" fill="#17b37f"/>
    <rect x="420" y="360" width="40" height="100" rx="6" fill="#17b37f"/>
    <rect x="480" y="410" width="40" height="50" rx="6" fill="#17b37f"/>
    <rect x="540" y="350" width="40" height="110" rx="6" fill="#17b37f"/>
    <rect x="600" y="390" width="40" height="70" rx="6" fill="#17b37f"/>
    <rect x="660" y="340" width="40" height="120" rx="6" fill="#17b37f"/>
  </g>

  <!-- pie chart panel -->
  <rect x="840" y="245" width="320" height="250" rx="20" fill="#ffffff" opacity="0.7"/>
  <text x="865" y="278" font-size="14" font-weight="bold" fill="#334155">Spending by Category</text>
  <circle cx="1000" cy="380" r="70" fill="none" stroke="#17b37f" stroke-width="30" stroke-dasharray="150 290" />
  <circle cx="1000" cy="380" r="70" fill="none" stroke="#328eff" stroke-width="30" stroke-dasharray="90 350" stroke-dashoffset="-150"/>
  <circle cx="1000" cy="380" r="70" fill="none" stroke="#c8a86c" stroke-width="30" stroke-dasharray="60 380" stroke-dashoffset="-240"/>
  <circle cx="1000" cy="380" r="70" fill="none" stroke="#e1574f" stroke-width="30" stroke-dasharray="140 300" stroke-dashoffset="-300"/>

  <!-- appointments + reminders row -->
  <rect x="260" y="515" width="565" height="180" rx="20" fill="#ffffff" opacity="0.7"/>
  <text x="285" y="548" font-size="14" font-weight="bold" fill="#334155">Upcoming Appointments</text>
  <g font-size="13" fill="#475569">
    <circle cx="300" cy="580" r="5" fill="#17b37f"/>
    <text x="315" y="585">Dental Cleaning — Buddy — Aug 2, 10:30 AM</text>
    <circle cx="300" cy="612" r="5" fill="#17b37f"/>
    <text x="315" y="617">Vaccination Booster — Luna — Jul 30, 2:00 PM</text>
    <circle cx="300" cy="644" r="5" fill="#17b37f"/>
    <text x="315" y="649">Nail Trim &amp; Checkup — Milo — Aug 8, 9:00 AM</text>
  </g>

  <rect x="840" y="515" width="320" height="180" rx="20" fill="#ffffff" opacity="0.7"/>
  <text x="865" y="548" font-size="14" font-weight="bold" fill="#334155">Vaccination Reminders</text>
  <g font-size="12" fill="#475569">
    <rect x="860" y="565" width="280" height="30" rx="8" fill="#fef2f2"/>
    <text x="872" y="585">DHPP — Buddy — Due in 5 days</text>
    <rect x="860" y="602" width="280" height="30" rx="8" fill="#eefdf6"/>
    <text x="872" y="622">RHDV2 — Milo — Due in 15 days</text>
  </g>
</svg>
