<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a7455"/>
      <stop offset="55%" stop-color="#0c9268"/>
      <stop offset="100%" stop-color="#1a6df5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- decorative paw prints -->
  <g fill="#ffffff" opacity="0.10">
    <g transform="translate(1000,40) scale(1.3)">
      <ellipse cx="0" cy="0" rx="8" ry="10"/>
      <ellipse cx="18" cy="-4" rx="7" ry="9"/>
      <ellipse cx="34" cy="4" rx="6" ry="8"/>
      <ellipse cx="10" cy="18" rx="16" ry="13"/>
    </g>
    <g transform="translate(1100,180) scale(1.1) rotate(15)">
      <ellipse cx="0" cy="0" rx="8" ry="10"/>
      <ellipse cx="18" cy="-4" rx="7" ry="9"/>
      <ellipse cx="34" cy="4" rx="6" ry="8"/>
      <ellipse cx="10" cy="18" rx="16" ry="13"/>
    </g>
    <g transform="translate(80,220) scale(1.0) rotate(-10)">
      <ellipse cx="0" cy="0" rx="8" ry="10"/>
      <ellipse cx="18" cy="-4" rx="7" ry="9"/>
      <ellipse cx="34" cy="4" rx="6" ry="8"/>
      <ellipse cx="10" cy="18" rx="16" ry="13"/>
    </g>
  </g>

  <!-- logo badge -->
  <g transform="translate(70,95)">
    <rect x="0" y="0" width="110" height="110" rx="28" fill="#ffffff" opacity="0.16"/>
    <text x="55" y="76" font-size="58" text-anchor="middle">🐾</text>
  </g>

  <text x="215" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#ffffff">PetCare Hub</text>
  <text x="217" y="178" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#eafff5" opacity="0.92">Smart Pet Management System</text>
  <text x="217" y="210" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#eafff5" opacity="0.75">Vaccinations · Medical History · Medicines · Appointments · Expenses · Documents</text>
</svg>
