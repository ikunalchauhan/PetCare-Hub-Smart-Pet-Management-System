version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: petcare-hub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - petcare_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petcare-hub-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/petcare_hub
      JWT_SECRET: PetCareHubSuperSecretSigningKeyForJWTTokenGeneration2026ChangeMeInProd
      JWT_EXPIRATION_MS: 86400000
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SERVER_PORT: 8080
    volumes:
      - petcare_uploads:/app/uploads

volumes:
  petcare_mongo_data:
  petcare_uploads:
